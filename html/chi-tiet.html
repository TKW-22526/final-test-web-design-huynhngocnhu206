<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết sản phẩm</title>
    <style>
body {
    font-family: Arial;
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #e8f5e9, #f5f5f5);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

/* CARD */
.detail-card {
    background: white;
    max-width: 520px;
    margin: 60px auto;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    text-align: center;
    transition: 0.3s;
}

.detail-card:hover {
    transform: translateY(-5px);
}

/* IMAGE */
.detail-card img {
    width: 100%;
    max-height: 280px;
    object-fit: cover;
    border-radius: 12px;
    margin-bottom: 15px;
}

/* TITLE */
h2 {
    color: #2e7d32;
    margin: 10px 0;
    font-size: 28px;
}

/* PRICE */
.price {
    font-size: 20px;
    color: #e53935;
    font-weight: bold;
}

/* DESCRIPTION */
.desc {
    margin-top: 15px;
    line-height: 1.6;
    color: #444;
    text-align: left;
    background: #f9f9f9;
    padding: 12px;
    border-radius: 10px;
    border-left: 4px solid #4caf50;
}

/* BUTTON */
.back-btn {
    display: inline-block;
    margin-top: 25px;
    padding: 10px 25px;
    background: linear-gradient(135deg, #4caf50, #2e7d32);
    color: white;
    border-radius: 25px;
    text-decoration: none;
    transition: 0.3s;
    font-weight: bold;
}

.back-btn:hover {
    transform: scale(1.05);
    background: linear-gradient(135deg, #2e7d32, #1b5e20);
}

/* FOOTER */
footer {
    margin-top: auto;
    background: #1b5e20;
    color: white;
    text-align: center;
    padding: 15px;padding: 18px 60px;
    font-size: 13px;
    letter-spacing: 0.3px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    font-weight: bold;
}
    </style>
</head>
<body>

    <div class="detail-card">
        <img id="img" src="" alt="Ảnh sản phẩm">
        <h2 id="name"></h2>
        <p class="price" id="price"></p>
        <p class="desc" id="desc"></p>
        <a href="javascript:history.back()" class="back-btn">← Quay lại</a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById("name").textContent = params.get("name") || "Không rõ";
        document.getElementById("price").textContent = "Giá: " + (params.get("price") || "");
        document.getElementById("desc").textContent = params.get("desc") || "";
        document.getElementById("img").src = params.get("img") || "";
    </script>

</body>
</html>
